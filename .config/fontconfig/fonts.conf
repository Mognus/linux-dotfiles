<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The base fonts: every app that asks for "monospace" or "sans-serif" gets
       these. An app overrides them by naming a real font in its own config.
       binding="same" makes the choice strong; distros ship their own strong
       defaults (NixOS: DejaVu), and a strong default beats a weak preference. -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>PxPlus IBM VGA 8x16</family>
      <family>DejaVu Sans Mono</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
    </prefer>
  </alias>
  <!-- Alacritty requests VGA by name rather than the generic monospace alias. -->
  <alias binding="same">
    <family>PxPlus IBM VGA 8x16</family>
    <accept>
      <family>DejaVu Sans Mono</family>
      <family>Symbols Nerd Font Mono</family>
    </accept>
  </alias>
</fontconfig>
