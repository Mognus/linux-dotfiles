# Six named scratchpads instead of one shared special tag.
# Only one scratchpad is shown at a time; no opening/closing animation.
# Ratios approximate the old 32 px margins and adapt to different displays.
# Notes use a narrower window, approximating their old 240 px side margins.
# Non-terminal app IDs must be checked in Mango with mmsg get last_open_surface.
# Matching by application also affects windows opened from other launchers.
window_rule=app_id:^mango-term$,is_named_scratchpad:1,single_scratchpad:1,width:0.96,height:0.94,no_animation:1
window_rule=app_id:^[Ll]ibre[Ww]olf$,is_named_scratchpad:1,single_scratchpad:1,width:0.96,height:0.94,no_animation:1
window_rule=app_id:^[Dd]iscord$,is_named_scratchpad:1,single_scratchpad:1,width:0.96,height:0.94,no_animation:1
window_rule=app_id:^[Oo]bsidian$,is_named_scratchpad:1,single_scratchpad:1,width:0.75,height:0.94,no_animation:1
window_rule=app_id:^[Tt]hunar$,is_named_scratchpad:1,single_scratchpad:1,width:0.96,height:0.94,no_animation:1
window_rule=app_id:^chromium.*,title:.*YouTube Music.*,is_named_scratchpad:1,single_scratchpad:1,width:0.96,height:0.94,no_animation:1

# Same keys as hypr/lua/binds.lua. First press starts the application;
# subsequent presses show/hide the matching scratchpad.
bind=SUPER+CTRL,Return,toggle_named_scratchpad,^mango-term$,none,alacritty --class mango-term
bind=SUPER+CTRL,b,toggle_named_scratchpad,^[Ll]ibre[Ww]olf$,none,librewolf
bind=SUPER+CTRL,d,toggle_named_scratchpad,^[Dd]iscord$,none,discord
bind=SUPER+CTRL,n,toggle_named_scratchpad,^[Oo]bsidian$,none,obsidian
bind=SUPER+CTRL,f,toggle_named_scratchpad,^[Tt]hunar$,none,thunar
bind=SUPER+CTRL,m,toggle_named_scratchpad,^chromium.*,.*YouTube Music.*,chromium --app=https://music.youtube.com
