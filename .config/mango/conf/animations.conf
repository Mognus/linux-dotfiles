# Slide and fade windows, matching the intent of hypr/lua/appearance.lua.
animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1

# Initial approximation: Hyprland speed values are not milliseconds.
animation_duration_open=400
animation_duration_move=400
animation_duration_close=300
animation_duration_tag=400

# Same Bezier control points as easeOut, linear and workspaceEaseOut.
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_close=0,0,1,1
animation_curve_opacity_fade_in=0,0,1,1
animation_curve_opacity_fade_out=0,0,1,1
animation_curve_tag=0.16,1,0.3,1
tag_animation_direction=1

# Quickshell menus must appear immediately.
layer_rule=layer_name:^settings$,no_animation:1
layer_rule=layer_name:^launcher$,no_animation:1

