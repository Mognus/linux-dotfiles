font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font auto
font_size 11.0

background_opacity 0.95
dynamic_background_opacity yes
window_padding_width 12
hide_window_decorations yes

background #0e0e11
foreground #cdd6f4

# Keep Kitty tabs separate from Neovim tabs.
map alt+t new_tab
map alt+q close_tab
map ctrl+alt+r set_tab_title
map alt+j previous_tab
map alt+k next_tab

# Pass Kitty's old tab shortcuts through to Neovim.
map ctrl+shift+t
map ctrl+shift+q
map ctrl+shift+left
map ctrl+shift+right

# Keep terminal search away from Neovim's Ctrl+Shift mappings.
map ctrl+shift+f no_op
map ctrl+shift+b no_op
map ctrl+alt+/ launch --type=overlay kitty +kitten search
map ctrl+alt+? launch --type=overlay kitty +kitten search --backwards

# Adjust background transparency in steps (needs dynamic_background_opacity).
map ctrl+alt+equal set_background_opacity +0.05
map ctrl+alt+plus  set_background_opacity +0.05
map ctrl+alt+minus set_background_opacity -0.05
map ctrl+alt+0     set_background_opacity default
