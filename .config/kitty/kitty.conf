font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font auto
font_size 11.0

background_opacity 0.9
window_padding_width 12
hide_window_decorations yes

background #0e0e11
foreground #cdd6f4

# Keep terminal search away from Neovim's Ctrl+Shift mappings.
map ctrl+shift+f no_op
map ctrl+shift+b no_op
map ctrl+alt+/ launch --type=overlay kitty +kitten search
map ctrl+alt+? launch --type=overlay kitty +kitten search --backwards
