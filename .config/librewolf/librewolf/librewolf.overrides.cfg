// Vertical tabs in the sidebar, with history and bookmarks below them.
// defaultPref instead of pref: LibreWolf adds the icons of new extensions to
// sidebar.main.tools, and pref() would reset that list on every start.
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.main.tools", "history,bookmarks");

// Firefox Sync is off in LibreWolf by default; this brings back the account
// button and the Sync section in the settings.
defaultPref("identity.fxaccounts.enabled", true);

// Tracking protection stays strict, but with the exceptions Firefox calls
// "Fix major site issues" (baseline) and "Fix minor site issues" (convenience),
// e.g. embedded videos and login widgets keep working. LibreWolf only enables major.
defaultPref("privacy.trackingprotection.allow_list.baseline.enabled", true);
defaultPref("privacy.trackingprotection.allow_list.convenience.enabled", true);

// Ask per site before allowing WebGL instead of blocking it silently.
defaultPref("librewolf.webgl.prompt", true);

// After a crash start with a fresh window instead of the old tabs.
defaultPref("browser.sessionstore.resume_from_crash", false);

// Stay logged in: keep cookies and site data when LibreWolf closes.
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);

// Use the password manager, so the logins from Sync can be saved and filled in.
defaultPref("signon.rememberSignons", true);
defaultPref("signon.autofillForms", true);

// Websites follow the dark mode: resistFingerprinting always reports "light",
// so swap it for fingerprintingProtection with every target except the color scheme.
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");
