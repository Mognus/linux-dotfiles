# Force the built-in 16-color TTY theme and ASCII-friendly graph symbols.
# Alacritty's Gruvbox theme supplies the terminal's ANSI colors.
force_tty = true
theme_background = false

# Keep the existing process sorting preference.
proc_sorting = "memory"

# Edit this file rather than saving temporary menu changes into the dotfiles.
save_config_on_exit = false
