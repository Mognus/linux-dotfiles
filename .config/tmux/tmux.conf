set -g status-position top
set -g status on
set -g status-style "bg=default,fg=#777777"
set -gu status-format[1]
set -g status-left-length 30
set -g status-left "#[fg=green]● #[fg=#cdd6f4]#S #[fg=#444444]│ "
set -g status-right "#[fg=#777777]%H:%M"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=cyan] #I:#W "
set -g base-index 1
set -g pane-base-index 1
set -g mouse on
setw -g mode-keys vi
# Prefix on Ctrl+Space, so Ctrl+B reaches nvim (file explorer).
unbind-key C-b
set -g prefix C-Space
bind-key C-Space send-prefix
# Prefix, then a key: windows and sessions work without terminal remaps.
bind-key Tab last-window
bind-key s choose-tree -s
bind-key n command-prompt -p "New session:" "new-session -s '%%'"
bind-key x confirm-before -p "Session #S killen? (y/n)" kill-session
bind-key r command-prompt -I "#S" -p "Rename session:" "rename-session '%%'"
# Jump to the next session instead of detaching when the current one dies.
set -g detach-on-destroy off

# Alt switches tabs like Super switches Hyprland workspaces.
bind-key -n M-Tab last-window
bind-key -n M-n next-window
bind-key -n M-p previous-window
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

# Alt mirrors the dwm-style master controls in Hyprland.
bind-key -n M-j select-pane -t :.+
bind-key -n M-k select-pane -t :.-
bind-key -n M-J swap-pane -D
bind-key -n M-K swap-pane -U
bind-key -n M-h resize-pane -t '{top-left}' -L 5
bind-key -n M-l resize-pane -t '{top-left}' -R 5
bind-key -n M-S-Enter split-window -h -c "#{pane_current_path}" \; select-layout main-vertical
bind-key -n M-q kill-pane
bind-key -n M-f resize-pane -Z

# Copy mode selects like vim: v characters, V lines, Ctrl+V a block, y yanks.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -n M-/ copy-mode
