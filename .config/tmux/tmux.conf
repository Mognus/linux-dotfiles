set -g status-position top
set -g base-index 1
set -g pane-base-index 1
setw -g mode-keys vi
bind-key -n M-j previous-window
bind-key -n M-k next-window
bind-key -n M-J swap-window -t -1
bind-key -n M-K swap-window -t +1
bind-key -n C-M-h select-pane -L
bind-key -n C-M-j select-pane -D
bind-key -n C-M-k select-pane -U
bind-key -n C-M-l select-pane -R
bind-key -n M-t new-window
bind-key -n M-d kill-window
bind-key -n C-M-t split-window -h -c "#{pane_current_path}"
bind-key -n C-M-v split-window -v -c "#{pane_current_path}"
bind-key -n C-M-d kill-pane
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
