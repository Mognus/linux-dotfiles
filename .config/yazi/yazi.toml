[mgr]

# Match the Neovim explorer by showing dotfiles initially.
show_hidden = true

# Open in nvim explicitly — the files scratchpad launches `terminal -e yazi`
# without an interactive shell, so $EDITOR is never set and the default
# `${EDITOR:-vi}` opener fails with exit 127. Hardcoding nvim avoids that.
[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "Open in Neovim", for = "unix" },
]
pdf = [
  { run = 'zathura "$@"', orphan = true, desc = "Open PDF in Zathura", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "pdf" },
]
