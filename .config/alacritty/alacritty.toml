[general]
import = [
    "~/.local/state/dotfiles-theme/alacritty.toml",
]

[env]
TERM = "xterm-256color"

# Classic console appearance; installed through nix/modules/common.nix.
# Size is loaded from the shared state file and adjustable in Settings.
[font.normal]
family = "PxPlus IBM VGA 8x16"
style = "Regular"

[window]
decorations = "None"

# Vim-style buffer search. Gated to ~Vi so these stay out of the way once Vi
# mode is active — there you already get native /, ?, n, N.
[[keyboard.bindings]]
key = "/"
mods = "Control|Alt"
mode = "~Vi"
action = "SearchForward"

[[keyboard.bindings]]
key = "/"
mods = "Control|Alt|Shift"
mode = "~Vi"
action = "SearchBackward"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "Return"
mods = "Alt|Shift"
chars = "\u001B[13;4u"
