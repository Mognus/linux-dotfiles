[general]
import = [
    "~/.config/alacritty/colors.toml",
]

[env]
TERM = "xterm-256color"

# Classic console appearance; installed through nix/modules/common.nix.
# Permanent settings live here; Ctrl+Plus/Minus changes size for this window.
[font]
size = 19.0

[font.normal]
family = "PxPlus IBM VGA 8x16"
style = "Regular"

[window]
decorations = "None"
opacity = 0.85
padding = { x = 23, y = 23 }

[[keyboard.bindings]]
key = "Return"
mods = "Alt|Shift"
chars = "\u001B[13;4u"

# Keep Ctrl+Shift+Enter distinct from plain Enter for Neovim splits.
[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
chars = "\u001B[13;6u"
