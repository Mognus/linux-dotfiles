[env]
TERM = "xterm-256color"

[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[window]
decorations = "None"
opacity = 0.90
padding = { x = 12, y = 12 }

[colors.primary]
background = "#0e0e11"
foreground = "#cdd6f4"

# Vim-style buffer search. Gated to ~Vi so these stay out of the way once Vi
# mode is active — there you already get native /, ?, n, N.
[[keyboard.bindings]]
key = "/"
mods = "Control|Alt"
mode = "~Vi"
action = "SearchForward"

[[keyboard.bindings]]
key = "/"
mods = "Control|Alt|Shift"
mode = "~Vi"
action = "SearchBackward"

# tmux has no native "Super" modifier, so Super+Alt+hjkl is remapped here to
# emit the same bytes as Ctrl+Alt+hjkl, which tmux's pane-switch binds expect.
[[keyboard.bindings]]
key = "H"
mods = "Super|Alt"
chars = "\u001b\u0008"

[[keyboard.bindings]]
key = "J"
mods = "Super|Alt"
chars = "\u001b\u000a"

[[keyboard.bindings]]
key = "K"
mods = "Super|Alt"
chars = "\u001b\u000b"

[[keyboard.bindings]]
key = "L"
mods = "Super|Alt"
chars = "\u001b\u000c"

[[keyboard.bindings]]
key = "T"
mods = "Super|Alt"
chars = "\u001b\u0014"

[[keyboard.bindings]]
key = "V"
mods = "Super|Alt"
chars = "\u001b\u0016"

[[keyboard.bindings]]
key = "D"
mods = "Super|Alt"
chars = "\u001b\u0004"

# Super+Alt+Shift+hjkl: pane resize (mirrors Hyprland's Super+Shift+hjkl
# window resize). Ctrl+Shift+letter is indistinguishable from Ctrl+letter at
# the byte level, so this sends custom sequences tmux registers as user-keys.
[[keyboard.bindings]]
key = "H"
mods = "Super|Alt|Shift"
chars = "\u001bRh"

[[keyboard.bindings]]
key = "J"
mods = "Super|Alt|Shift"
chars = "\u001bRj"

[[keyboard.bindings]]
key = "K"
mods = "Super|Alt|Shift"
chars = "\u001bRk"

[[keyboard.bindings]]
key = "L"
mods = "Super|Alt|Shift"
chars = "\u001bRl"

