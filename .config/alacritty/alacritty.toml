[general]
import = [
    "~/.local/state/dotfiles-theme/alacritty.toml",
]

[env]
TERM = "xterm-256color"

# Classic console appearance; installed through nix/modules/common.nix.
# Size is loaded from the shared state file and adjustable in Settings.
[font.normal]
family = "PxPlus IBM VGA 8x16"
style = "Regular"

[window]
decorations = "None"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "Return"
mods = "Alt|Shift"
chars = "\u001B[13;4u"

# Keep Ctrl+Shift+Enter distinct from plain Enter for Neovim splits.
[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
chars = "\u001B[13;6u"
