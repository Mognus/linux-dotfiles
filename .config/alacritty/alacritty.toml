[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[window]
opacity = 0.7
padding = { x = 12, y = 12 }
decorations = "None"

[colors.primary]
background = "#0e0e11"
foreground = "#cdd6f4"

[keyboard]
# Keep terminal search away from Neovim's Ctrl+Shift mappings.
bindings = [
  { key = "F", mods = "Control|Shift", action = "ReceiveChar" },
  { key = "B", mods = "Control|Shift", action = "ReceiveChar" },
  { key = "/", mods = "Control|Alt", action = "SearchForward" },
  { key = "?", mods = "Control|Alt", action = "SearchBackward" },
  { key = "?", mods = "Control|Alt|Shift", action = "SearchBackward" },
]
