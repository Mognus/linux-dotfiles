# =============================================================================
# HYPRLAND CONFIG — minimal
# =============================================================================

source = ~/.config/theme/active

# --- Monitor ---
monitor=DP-3,1920x1080@144,0x0,1
monitor=HDMI-A-1,preferred,auto,1,mirror,DP-3

# --- Environment ---
env = ELECTRON_OZONE_PLATFORM_HINT,auto
$terminal = kitty

# --- Autostart ---
# CHANGE: replace with your microphone device (run: pactl list sources short)
exec-once = pactl set-default-source alsa_input.usb-Kingston_HyperX_7.1_Audio_00000000-00.analog-stereo
exec-once = waybar
exec-once = ~/.config/waybar/scripts/scratchpad-listener.sh
exec-once = dunst
exec-once = hyprpaper
# CHANGE: replace /home/magnus with your home directory
exec-once = sleep 2 && hyprctl hyprpaper wallpaper "DP-3,/home/magnus/.config/wallpapers/Tank-Girl-Wallpaper-Black.png"
exec-once = [workspace special:term silent] $terminal
exec-once = eww open tux-angel
exec-once = eww open tux-devil

bind = CTRL SUPER SHIFT, T, exec, ~/.config/eww/scripts/tux-toggle.sh

# --- Input ---
input {
    kb_layout = us
    # kb_options = lv3:ralt_switch,umlaut:on
    # Note: custom umlaut xkb file must be installed via keyboard-config repo
    follow_mouse = 1
    sensitivity = 0
}

# --- General ---
general {
    gaps_in = 0
    gaps_out = 8
    border_size = 1
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    layout = dwindle
}

# --- Appearance ---
decoration {
    rounding = 0
    dim_special = 0.4
    blur {
        enabled = true
        size = 4
        passes = 1
        noise = 0.1
    }
}

animations {
    enabled = true

    bezier = easeOut, 0.05, 0.9, 0.1, 1.05
    bezier = linear,  0.0,  0.0, 1.0, 1.0

    animation = windows,       1, 4,  easeOut, slide
    animation = windowsOut,    1, 3,  linear,  slide
    animation = fade,          1, 4,  linear
    animation = workspaces,       1, 4,  easeOut, slide
    animation = specialWorkspace, 1, 4, easeOut, slidevert
}

# --- Layout ---
dwindle {
    preserve_split = true
}

# =============================================================================
# KEYBINDS
# =============================================================================

$mod = SUPER

# Terminal
bind = $mod, Return, exec, $terminal

# Browser
bind = $mod, B, exec, firefox
bind = $mod, T, exec, tor-browser

# Firefox Scratchpad (Special Workspace)
bind = $mod CTRL, B, togglespecialworkspace, firefox

# Discord Scratchpad (Special Workspace)
bind = $mod CTRL, D, togglespecialworkspace, discord

# Notes Scratchpad (Special Workspace)
bind = $mod CTRL, N, togglespecialworkspace, notes

# File Manager Scratchpad (Special Workspace)
bind = $mod CTRL, F, togglespecialworkspace, files

# Music (Submap: M = YT Music, L = Local)
bind = $mod CTRL, M, submap, music
submap = music
bind = , M, togglespecialworkspace, music
bind = , L, togglespecialworkspace, cmus
bind = , escape, submap, reset
bind = , catchall, submap, reset
submap = reset

# Launcher (rofi)
bind = $mod, Space, exec, rofi -show drun

# Lock screen
bind = $mod, Escape, exec, hyprlock

# Sleep
bind = $mod, F1, exec, systemctl suspend

# Screenshots
bind = $mod, S, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%F_%T).png
bind = $mod CTRL, S, exec, grim -g "$(slurp)" -t png - | wl-copy --type image/png

# Close window
bind = $mod, Q, killactive

# Fullscreen
bind = $mod, F, fullscreen

# Float toggle
bind = $mod CTRL, Space, togglefloating

# Focus
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Switch workspaces
bind = $mod CTRL, h, workspace, r-1
bind = $mod CTRL, l, workspace, r+1

# Move window within workspace
bind = $mod CTRL SHIFT, h, movewindow, l
bind = $mod CTRL SHIFT, l, movewindow, r
bind = $mod CTRL SHIFT, k, movewindow, u
bind = $mod CTRL SHIFT, j, movewindow, d

# Move window to next/prev workspace and follow
bind = $mod ALT, h, movetoworkspace, r-1
bind = $mod ALT, l, movetoworkspace, r+1

# Resize active window
binde = $mod SHIFT, h, resizeactive, -40 0
binde = $mod SHIFT, l, resizeactive, 40 0
binde = $mod SHIFT, k, resizeactive, 0 -40
binde = $mod SHIFT, j, resizeactive, 0 40

# =============================================================================
# WORKSPACES
# =============================================================================

# Special workspaces
workspace = special:term, on-created-empty:$terminal, gapsout:48
workspace = special:firefox, on-created-empty:firefox, gapsout:48
workspace = special:discord, on-created-empty:discord, gapsout:48
workspace = special:notes, on-created-empty:obsidian, gapsout:32 240
workspace = special:files, on-created-empty:$terminal -e yazi, gapsout:48
workspace = special:music, on-created-empty:chromium --app=https://music.youtube.com, gapsout:48
workspace = special:cmus, on-created-empty:$terminal -e cmus, gapsout:48

# Switch by number
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod CTRL, 1, workspace, 1
bind = $mod CTRL, 2, workspace, 2
bind = $mod CTRL, 3, workspace, 3
bind = $mod CTRL, 4, workspace, 4
bind = $mod CTRL, 5, workspace, 5
bind = $mod CTRL, 6, workspace, 6
bind = $mod CTRL, 7, workspace, 7
bind = $mod CTRL, 8, workspace, 8
bind = $mod CTRL, 9, workspace, 9

# Terminal Scratchpad
bind = $mod CTRL, Return, togglespecialworkspace, term

# Screen Recording
bind = $mod CTRL, v, exec, ~/.config/waybar/scripts/record-toggle.sh

# Move window to workspace
bind = $mod CTRL SHIFT, 1, movetoworkspace, 1
bind = $mod CTRL SHIFT, 2, movetoworkspace, 2
bind = $mod CTRL SHIFT, 3, movetoworkspace, 3
bind = $mod CTRL SHIFT, 4, movetoworkspace, 4
bind = $mod CTRL SHIFT, 5, movetoworkspace, 5
bind = $mod CTRL SHIFT, 6, movetoworkspace, 6
bind = $mod CTRL SHIFT, 7, movetoworkspace, 7
bind = $mod CTRL SHIFT, 8, movetoworkspace, 8
bind = $mod CTRL SHIFT, 9, movetoworkspace, 9
