general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = rgb(050507)
    blur_passes = 1
    blur_size = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 50
    rounding = 0
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 1
    outer_color = rgb(d8d8d8)
    inner_color = rgb(101014)
    font_color = rgb(ffffff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <i>Passwort...</i>
    placeholder_color = rgb(888888)
    check_color = rgb(00d7d7)
    fail_color = rgb(f38ba8)
    fail_text = <i>Falsch</i>
    capslock_color = rgb(f9e2af)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(00d7d7)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}
